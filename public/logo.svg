<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cameroonStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Optional (transparent by default) -->
  <g id="motologa-logo-mark">
    <!-- Gear with polygonal constellation nodes (behind T and right of M) -->
    <g transform="translate(325, 255)">
      <!-- Gear Outer Ring & Teeth -->
      <path d="M 0,-65 L 14,-65 L 17,-50 A 62 62 0 0 1 35,-42 L 48,-51 L 58,-41 L 49,-28 A 62 62 0 0 1 56,-10 L 71,-8 L 71,8 L 56,10 A 62 62 0 0 1 49,28 L 58,41 L 48,51 A 62 62 0 0 1 35,42 L 17,50 L 14,65 L -14,65 L -17,50 A 62 62 0 0 1 -35,42 L -48,51 L -58,41 L -49,28 A 62 62 0 0 1 -56,10 L -71,8 L -71,-8 L -56,-10 A 62 62 0 0 1 -49,-28 L -58,-41 L -48,-51 L -35,-42 A 62 62 0 0 1 -17,-50 L -14,-65 Z"
            fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" />
      
      <!-- Inner circular guide -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="currentColor" stroke-width="3.5" stroke-dasharray="4 4" opacity="0.6" />
      
      <!-- Constellation / Triangulated Nodes & Edges -->
      <g stroke="currentColor" stroke-width="2.5" opacity="0.95">
        <line x1="20" y1="-36" x2="38" y2="-12" />
        <line x1="38" y1="-12" x2="42" y2="18" />
        <line x1="38" y1="-12" x2="18" y2="4" />
        <line x1="42" y1="18" x2="22" y2="38" />
        <line x1="22" y1="38" x2="0" y2="42" />
        <line x1="18" y1="4" x2="22" y2="38" />
        <line x1="18" y1="4" x2="0" y2="42" />
        <line x1="38" y1="-12" x2="55" y2="6" />
        <line x1="42" y1="18" x2="55" y2="6" />
        <line x1="22" y1="38" x2="38" y2="48" />
        <line x1="42" y1="18" x2="38" y2="48" />
        <line x1="0" y1="42" x2="-22" y2="38" />
        <line x1="0" y1="42" x2="8" y2="60" />
        <line x1="22" y1="38" x2="8" y2="60" />
      </g>
      <!-- Nodes (dots) -->
      <g fill="currentColor">
        <circle cx="20" cy="-36" r="4" />
        <circle cx="38" cy="-12" r="4" />
        <circle cx="55" cy="6" r="4.5" />
        <circle cx="42" cy="18" r="4" />
        <circle cx="38" cy="48" r="4" />
        <circle cx="22" cy="38" r="4" />
        <circle cx="8" cy="60" r="4" />
        <circle cx="0" cy="42" r="4" />
        <circle cx="18" cy="4" r="4" />
        <circle cx="-22" cy="38" r="3.5" />
      </g>
    </g>

    <!-- Industrial Angular "M" -->
    <path d="M 160,155 L 210,155 L 245,245 L 275,155 L 305,155 L 285,280 L 240,280 L 240,270 L 220,215 L 195,280 L 150,280 L 175,155 Z"
          fill="currentColor" />
    <!-- Beveled top accent cut on M -->
    <polygon points="150,280 185,155 220,155 178,280" fill="currentColor" />
    <polygon points="212,155 245,236 270,155 300,155 272,245 258,280 238,280 216,215" fill="currentColor" />

    <!-- Industrial Angular "T" (overlaps and anchors right side) -->
    <!-- T Roof / Crossbar with beveled end -->
    <polygon points="262,125 375,125 370,162 335,162 335,145 295,145 285,162 262,162" fill="currentColor" />
    <!-- T Vertical Stem -->
    <polygon points="280,145 328,145 305,255 275,255" fill="currentColor" />

    <!-- Full combined high-precision letter MT silhouettes -->
    <!-- Outer sharp polygon for M left wing -->
    <path d="M 152 280 L 178 152 L 228 152 L 188 280 Z" fill="currentColor" />
    <!-- Center V of M -->
    <path d="M 226 152 L 278 280 L 246 280 L 214 200 Z" fill="currentColor" />
    <path d="M 276 280 L 302 152 L 268 152 L 254 220 Z" fill="currentColor" />
    <!-- T Bar -->
    <path d="M 260 122 L 378 122 L 368 160 L 340 160 L 344 140 L 288 140 L 275 160 L 252 160 Z" fill="currentColor" />
    <!-- T Stem -->
    <path d="M 284 140 L 324 140 L 302 258 L 272 258 Z" fill="currentColor" />

    <!-- Wordmark "MOTOLOGA" -->
    <text x="250" y="318"
          text-anchor="middle"
          fill="currentColor"
          font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif"
          font-weight="900"
          font-size="28"
          letter-spacing="7"
          style="text-transform: uppercase;">
      MOTOLOGA
    </text>
  </g>
</svg>
